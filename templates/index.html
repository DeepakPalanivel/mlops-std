<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Result Predictor</title>
<style>
body{font-family:Arial,sans-serif;max-width:540px;margin:40px auto;padding:20px;background:#f3f6fb}
main{background:white;padding:25px;border-radius:12px;box-shadow:0 4px 18px #0001}
label{display:block;margin-top:15px}
input,button{box-sizing:border-box;width:100%;padding:11px;margin-top:6px}
button{background:#1457c5;color:white;border:0;border-radius:6px;cursor:pointer}
.result{font-size:20px;font-weight:bold}
</style>
</head>
<body><main>
<h1>Student Result Predictor</h1>
<p><strong>Model Version:</strong> {{ version }}</p>
<form method="post">
<label>Study hours per day (0–24)</label>
<input type="number" name="study_hours" min="0" max="24" step="0.5" required>
<label>Attendance (%)</label>
<input type="number" name="attendance" min="0" max="100" step="0.1" required>
<label>Internal marks (out of 50)</label>
<input type="number" name="internal_marks" min="0" max="50" step="0.5" required>
<button type="submit">Predict Result</button>
</form>
{% if prediction %}<p class="result">Prediction: {{ prediction }}</p>{% endif %}
</main></body></html>
